<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="システム開発工程の流れ">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1f3a5f; stroke-width: 1.2; }
      .title { font-family: "Hiragino Kaku Gothic ProN", sans-serif; font-weight: 700; font-size: 13px; fill: #1f3a5f; }
      .sub { font-family: "Hiragino Kaku Gothic ProN", sans-serif; font-size: 10px; fill: #5b6675; }
      .arrow { fill: none; stroke: #3c5a80; stroke-width: 1.4; }
      .note { font-family: "Hiragino Kaku Gothic ProN", sans-serif; font-size: 11px; fill: #5b6675; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c5a80" />
    </marker>
  </defs>

  <!-- 5 steps -->
  <g>
    <rect class="box" x="20"  y="60" width="110" height="60" rx="6" />
    <text class="title" x="75"  y="88" text-anchor="middle">要件定義</text>
    <text class="sub"   x="75"  y="108" text-anchor="middle">何を作るか</text>
  </g>
  <g>
    <rect class="box" x="150" y="60" width="110" height="60" rx="6" />
    <text class="title" x="205" y="88" text-anchor="middle">設計</text>
    <text class="sub"   x="205" y="108" text-anchor="middle">どう作るか</text>
  </g>
  <g>
    <rect class="box" x="280" y="60" width="110" height="60" rx="6" />
    <text class="title" x="335" y="88" text-anchor="middle">実装</text>
    <text class="sub"   x="335" y="108" text-anchor="middle">作る</text>
  </g>
  <g>
    <rect class="box" x="410" y="60" width="110" height="60" rx="6" />
    <text class="title" x="465" y="88" text-anchor="middle">テスト</text>
    <text class="sub"   x="465" y="108" text-anchor="middle">動くか</text>
  </g>
  <g>
    <rect class="box" x="540" y="60" width="90" height="60" rx="6" />
    <text class="title" x="585" y="88" text-anchor="middle">運用・保守</text>
    <text class="sub"   x="585" y="108" text-anchor="middle">使い続ける</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M130 90 L150 90" marker-end="url(#arr)" />
  <path class="arrow" d="M260 90 L280 90" marker-end="url(#arr)" />
  <path class="arrow" d="M390 90 L410 90" marker-end="url(#arr)" />
  <path class="arrow" d="M520 90 L540 90" marker-end="url(#arr)" />

  <!-- Notes -->
  <text class="note" x="320" y="170" text-anchor="middle">ウォーターフォール：一方向に進む</text>
  <text class="note" x="320" y="190" text-anchor="middle">アジャイル：この流れを小さく何周もする</text>
</svg>
