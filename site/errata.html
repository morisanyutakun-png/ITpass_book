<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正誤表 — 図でつながる ITパスポート</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script defer src="assets/js/main.js"></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", async () => {
      const mount = document.querySelector("#errata-root");
      try {
        const data = await fetchJSON("data/errata.json");
        const rows = Array.isArray(data.items) ? data.items : [];
        renderTable(mount, rows, [
          { label: "刷", key: "printing" },
          { label: "掲載位置", key: "location" },
          { label: "誤", key: "wrong" },
          { label: "正", key: "correct" },
          { label: "公開日", render: (r) => formatDate(r.date) },
        ]);
      } catch (e) {
        mount.innerHTML = `<p style="color:var(--color-alert)">データの読み込みに失敗しました: ${e.message}</p>`;
      }
    });
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-title">
        図でつながる ITパスポート
        <small>大学生・新社会人のための、理解で受かる参考書</small>
      </div>
      <nav class="site-nav" aria-label="主要ナビ">
        <a href="index.html">トップ</a>
        <a href="about.html">本書について</a>
        <a href="downloads.html">ダウンロード</a>
        <a href="quiz.html">確認テスト</a>
        <a href="errata.html">正誤表</a>
        <a href="changelog.html">更新履歴</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>正誤表</h1>
      <p>本書の誤記・誤字・内容の修正情報を、刷単位で整理して掲載します。お手元の書籍の刷数をご確認のうえご参照ください。</p>
    </section>

    <section>
      <h2>現在の正誤情報</h2>
      <div id="errata-root"></div>
    </section>

    <section>
      <h2>誤記を見つけられた方へ</h2>
      <div class="box box--info">
        <p>誤りを発見された場合は、リポジトリの Issue もしくは編集部連絡先までお知らせいただけますと幸いです。ご報告は次回増刷の反映候補として検討します。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    © 図でつながる ITパスポート 編集部
  </footer>
</body>
</html>
